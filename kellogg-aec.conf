# Kellogg magneto phone - PipeWire echo cancellation.
#
# Install to:  ~/.config/pipewire/pipewire.conf.d/kellogg-aec.conf
# Then:        systemctl --user restart pipewire pipewire-pulse
# Verify:      python src/audio.py devices     (look for echo-cancel-*)
#              python src/audio.py echo        (must PASS)
#
# WHY THIS EXISTS
#
# The mouthpiece and the earpiece of a telephone handset are about six
# inches apart. Without cancellation the operator's own voice goes out of
# the earpiece, straight back into the MAX4466, and into Vosk - so the
# recogniser hears the operator asking who you want to call at the same
# volume as you answering. It does not half-work; it fails completely and
# in a way that looks like a bad microphone.
#
# Set this up BEFORE writing anything that captures audio. It creates
# virtual devices that everything else must bind to, and retrofitting it
# means rewiring the whole audio path.
#
# THE NODE NAMES BELOW ARE AN INTERFACE.
# audio.py looks for "echo-cancel-source" and "echo-cancel-sink" by name
# (AEC_SOURCE_HINT / AEC_SINK_HINT). Change them here and you must change
# them there, or AudioConfig will silently fall back to the raw card and
# the phone will regress to the failure described above.

context.modules = [
  { name = libpipewire-module-echo-cancel
    args = {
      # The WebRTC canceller. The alternative is a null implementation
      # that does nothing, which passes configuration and fails in use.
      library.name  = aec/libspa-aec-webrtc

      # 1024 frames at 48 kHz is about 21 ms. Shorter starves the
      # canceller of context and it stops converging; longer adds
      # audible delay to a conversation.
      node.latency = 1024/48000

      # What the canceller listens to: the real microphone.
      # node.target is deliberately left out so PipeWire uses the default
      # source. Naming the USB card here would reintroduce exactly the
      # index-fragility that audio.py exists to avoid.
      capture.props = {
        node.name   = "effect_input.echo-cancel"
        node.passive = true
      }

      # What applications record from instead of the raw card.
      source.props = {
        node.name        = "echo-cancel-source"
        node.description = "Kellogg handset (echo cancelled)"
      }

      # What applications play to.
      sink.props = {
        node.name        = "echo-cancel-sink"
        node.description = "Kellogg earpiece (echo cancelled)"
      }

      # Where the cancelled output actually goes: the real speaker.
      playback.props = {
        node.name   = "effect_output.echo-cancel"
        node.passive = true
      }

      aec.args = {
        # The reason this file exists.
        webrtc.echo_canceller        = true
        webrtc.extended_filter       = true

        # A 1900s carbon-era handset against an ear, in a hallway. Noise
        # suppression earns its keep here.
        webrtc.noise_suppression     = true

        # Digital only. Analogue gain control would fight the MAX4466's
        # trimpot, and that pot is set by hand with audio.py's level
        # meter - two things adjusting the same gain is how you get a
        # microphone that drifts between quiet and clipping.
        webrtc.gain_control          = true
        webrtc.analog_gain_control   = false
        webrtc.digital_gain_control  = true

        # Helps the canceller know when the near end is actually talking.
        webrtc.voice_detection       = true
      }
    }
  }
]
